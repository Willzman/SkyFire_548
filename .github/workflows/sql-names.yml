name: sql-names

# Checks SQL update file names and placement (tools/dev/check_sql_names.py).
# Pull requests are also checked for renamed/deleted merged updates and for new
# updates that skip the _custom_ naming. Pull requests from main (upstream
# SkyFire syncs), or labelled "upstream-sync", relax those change checks.

on:
  workflow_dispatch:
  push:
    branches: [ Development, Stable ]
    paths:
      - 'sql/**'
      - 'tools/dev/check_sql_names.py'
      - '.github/workflows/sql-names.yml'
  pull_request:
    branches: [ Development, Stable ]
    types: [ opened, synchronize, reopened, labeled, unlabeled ]
    paths:
      - 'sql/**'
      - 'tools/dev/check_sql_names.py'
      - '.github/workflows/sql-names.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check SQL update names
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPSTREAM_SYNC: ${{ github.event_name == 'pull_request' && (github.head_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'upstream-sync')) }}
        run: |
          set -euo pipefail
          args=()
          if [ "$EVENT" = "pull_request" ]; then
            args+=(--base "$BASE_SHA")
            if [ "$UPSTREAM_SYNC" = "true" ]; then
              args+=(--upstream-sync)
            fi
          fi
          python3 tools/dev/check_sql_names.py "${args[@]}"
