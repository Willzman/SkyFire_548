# Gameplay settings of the Stable realm.
#
# configure_realm.sh stable copies each "Key = Value" line below into the
# Stable realm's worldserver.conf every time it runs (after the realm keys).
# A key the installed worldserver.conf.dist doesn't have yet (older code) is
# skipped with a warning. Lines starting with # and blank lines are ignored.
# Values are written verbatim: quote strings yourself.
#
# Change a value here (and re-run the script) rather than in the live
# worldserver.conf, or the next run puts it back.

# Dungeon Finder (PRs #251, #263, #265). Normal queues start once 3 players match;
# the Solo checkbox (launcher's Solo Queue add-on) queues a player alone;
# Raid Finder starts with any number of players (for small premades).
DungeonFinder.SoloQueue.Enable = 1
DungeonFinder.Dungeon.MinPlayers = 3
DungeonFinder.Scenario.MinPlayers = 3
DungeonFinder.RaidFinder.MinPlayers = 1
DungeonFinder.Dungeon.IgnoreRoles = 0
